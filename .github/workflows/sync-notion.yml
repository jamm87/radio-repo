name: Sync from Notion

# Sincroniza data/frequencies.json desde la base de datos "radio" de Notion.
# Requiere el secret NOTION_TOKEN en el repositorio (Settings > Secrets > Actions).
# Se puede lanzar a mano o de forma programada (descomenta el schedule).

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 * * 1"   # cada lunes a las 06:00 UTC

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: b709a140-dd16-4ae8-b892-eb0d5e1ed159
        run: node site/scripts/sync-notion.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/frequencies.json
          git diff --staged --quiet || git commit -m "sync: actualiza frecuencias desde Notion"
          git push
